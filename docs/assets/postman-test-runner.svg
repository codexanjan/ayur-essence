<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="passCardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="1200" height="820" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="1200" height="52" rx="16" fill="#121214"/>
  <rect y="40" width="1200" height="12" fill="#121214"/>
  <circle cx="28" cy="26" r="6" fill="#ef4444"/>
  <circle cx="48" cy="26" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="26" r="6" fill="#10b981"/>
  <text x="100" y="32" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Postman Collection Runner • Ayur Essence API Collection</text>
  <rect x="940" y="14" width="230" height="24" rx="6" fill="#27272a"/>
  <text x="955" y="30" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Env: Ayur Essence Local (4000)</text>

  <!-- Summary Banner -->
  <g transform="translate(32, 72)">
    <rect width="1136" height="120" rx="12" fill="url(#headerGrad)" stroke="#27272a" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Big 100% Ring / Badge -->
    <rect x="24" y="20" width="80" height="80" rx="40" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
    <text x="64" y="60" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">100%</text>
    <text x="64" y="78" text-anchor="middle" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PASSED</text>

    <!-- Stat 1 -->
    <text x="135" y="52" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">52 Passed</text>
    <text x="135" y="78" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">All assertions passed without failure</text>

    <!-- Stat 2 -->
    <rect x="360" y="28" width="1" height="64" fill="#27272a"/>
    <text x="390" y="52" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">0 Failed</text>
    <text x="390" y="78" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">0 syntax or assertion errors</text>

    <!-- Stat 3 -->
    <rect x="620" y="28" width="1" height="64" fill="#27272a"/>
    <text x="650" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">24 / 24</text>
    <text x="650" y="78" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Sequential requests in 11 test folders</text>

    <!-- Stat 4 -->
    <rect x="880" y="28" width="1" height="64" fill="#27272a"/>
    <text x="910" y="52" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">1.84s</text>
    <text x="910" y="78" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Total automated execution duration</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(32, 212)">
    <rect width="1136" height="34" rx="6" fill="#202024"/>
    <text x="24" y="22" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">STATUS</text>
    <text x="120" y="22" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">METHOD &amp; ENDPOINT</text>
    <text x="440" y="22" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">TEST ASSERTION DESCRIPTION</text>
    <text x="920" y="22" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">HTTP CODE</text>
    <text x="1040" y="22" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">TIME</text>
  </g>

  <!-- Test Rows -->
  <g transform="translate(32, 256)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    
    <!-- Row 1: Health -->
    <g transform="translate(0, 0)">
      <rect width="1136" height="42" rx="6" fill="#18181b"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#60a5fa" font-size="13" font-weight="700">GET</text><text x="160" y="26" fill="#e4e4e7" font-size="13">/api/health</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Status 200 OK • Service healthy &amp; responsive</text>
      <rect x="918" y="10" width="68" height="22" rx="4" fill="#1e293b"/><text x="952" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">200 OK</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">14 ms</text>
    </g>

    <!-- Row 2: Register -->
    <g transform="translate(0, 46)">
      <rect width="1136" height="42" rx="6" fill="#1c1c20"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/auth/register</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Doctor registered • Staff code validation PASS</text>
      <rect x="918" y="10" width="76" height="22" rx="4" fill="#1e293b"/><text x="956" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">201 Created</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">88 ms</text>
    </g>

    <!-- Row 3: Login Doctor -->
    <g transform="translate(0, 92)">
      <rect width="1136" height="42" rx="6" fill="#18181b"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/auth/login</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Login successful • JWT token captured in {{doctorToken}}</text>
      <rect x="918" y="10" width="68" height="22" rx="4" fill="#1e293b"/><text x="952" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">200 OK</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">62 ms</text>
    </g>

    <!-- Row 4: Create Patient -->
    <g transform="translate(0, 138)">
      <rect width="1136" height="42" rx="6" fill="#1c1c20"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/patients</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Patient profile created • ID stored in {{patientId}}</text>
      <rect x="918" y="10" width="76" height="22" rx="4" fill="#1e293b"/><text x="956" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">201 Created</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">34 ms</text>
    </g>

    <!-- Row 5: Questions -->
    <g transform="translate(0, 184)">
      <rect width="1136" height="42" rx="6" fill="#18181b"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#60a5fa" font-size="13" font-weight="700">GET</text><text x="160" y="26" fill="#e4e4e7" font-size="13">/api/questions</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Active questions loaded (16 indicators) • Internal scoringMap protected</text>
      <rect x="918" y="10" width="68" height="22" rx="4" fill="#1e293b"/><text x="952" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">200 OK</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">19 ms</text>
    </g>

    <!-- Row 6: Start Assessment -->
    <g transform="translate(0, 230)">
      <rect width="1136" height="42" rx="6" fill="#1c1c20"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/patients/:id/assessments</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Draft assessment created • ID captured in {{assessmentId}}</text>
      <rect x="918" y="10" width="76" height="22" rx="4" fill="#1e293b"/><text x="956" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">201 Created</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">27 ms</text>
    </g>

    <!-- Row 7: Upsert Responses -->
    <g transform="translate(0, 276)">
      <rect width="1136" height="42" rx="6" fill="#18181b"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#a855f7" font-size="13" font-weight="700">PUT</text><text x="160" y="26" fill="#e4e4e7" font-size="13">/api/assessments/:id/responses</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">16 answers upserted with JSONB scoring snapshots &amp; weights</text>
      <rect x="918" y="10" width="68" height="22" rx="4" fill="#1e293b"/><text x="952" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">200 OK</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">45 ms</text>
    </g>

    <!-- Row 8: Calculate -->
    <g transform="translate(0, 322)">
      <rect width="1136" height="42" rx="6" fill="#1c1c20"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/assessments/:id/calculate</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Prakriti calculated • Vata 48%, Pitta 30%, Kapha 22% (Sum = 100%)</text>
      <rect x="918" y="10" width="68" height="22" rx="4" fill="#1e293b"/><text x="952" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">200 OK</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">31 ms</text>
    </g>

    <!-- Row 9: RBAC Student Finalize -->
    <g transform="translate(0, 368)">
      <rect width="1136" height="42" rx="6" fill="#18181b"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/assessments/:id/finalize (Student)</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Student finalization forbidden • RBAC enforcement PASS</text>
      <rect x="918" y="10" width="88" height="22" rx="4" fill="#450a0a"/><text x="962" y="25" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">403 Forbidden</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">18 ms</text>
    </g>

    <!-- Row 10: Incomplete Assessment -->
    <g transform="translate(0, 414)">
      <rect width="1136" height="42" rx="6" fill="#1c1c20"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/assessments/:id/calculate (Incomplete)</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Completeness guard triggered • Code: ASSESSMENT_INCOMPLETE</text>
      <rect x="918" y="10" width="110" height="22" rx="4" fill="#451a03"/><text x="973" y="25" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="600">422 Unprocessable</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">22 ms</text>
    </g>

    <!-- Row 11: Doctor Finalize -->
    <g transform="translate(0, 460)">
      <rect width="1136" height="42" rx="6" fill="#18181b"/>
      <rect x="20" y="10" width="56" height="22" rx="4" fill="#064e3b"/><text x="48" y="25" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">PASS</text>
      <text x="120" y="26" fill="#f59e0b" font-size="13" font-weight="700">POST</text><text x="165" y="26" fill="#e4e4e7" font-size="13">/api/assessments/:id/finalize (Doctor)</text>
      <text x="440" y="26" fill="#a1a1aa" font-size="13">Doctor finalization succeeded • Status transitioned to FINALIZED</text>
      <rect x="918" y="10" width="68" height="22" rx="4" fill="#1e293b"/><text x="952" y="25" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">200 OK</text>
      <text x="1040" y="26" fill="#71717a" font-size="12">39 ms</text>
    </g>

  </g>

  <!-- Footer Info -->
  <rect y="776" width="1200" height="44" rx="16" fill="#121214"/>
  <text x="32" y="802" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ayur Essence Automated Postman Test Suite • Environment: Ayur_Essence_Local • Collection: Ayur_Essence.postman_collection.json</text>
  <text x="1040" y="802" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">All 52 Tests Passed</text>
</svg>
